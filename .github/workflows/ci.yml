name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

# Pipeline on pushes to main (see docs/releasing.md):
#   tests -> release-please -> publish images -> deploy-dev (always)
#                                              -> deploy-prod (only when a release was cut)
# Superseded PR runs are cancelled; pushes to main always run to completion.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps (needed by eslint/tsc hooks)
        run: npm ci
        working-directory: frontend
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go test ./...

  frontend:
    name: frontend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # Keeps a "chore(main): release x.y.z" PR open with the next version and
  # changelog. Merging that PR tags the release and creates the GitHub Release.
  release:
    name: release-please
    runs-on: ubuntu-latest
    needs: [lint, backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish images
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        env:
          RELEASED: ${{ needs.release.outputs.release_created }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          sha="${GITHUB_SHA::7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$RELEASED" = "true" ]; then
            echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=$sha" >> "$GITHUB_OUTPUT"
          fi

      # The cluster is arm64 (Mac mini); build for it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build gets the short SHA (what dev runs) and `main`; a release
      # build is additionally tagged with its version (what prod runs).
      - uses: docker/metadata-action@v5
        id: meta-backend
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.release_created == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - uses: docker/metadata-action@v5
        id: meta-frontend
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.release_created == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.vars.outputs.app_version }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # Deploys are commits to paguos/home-k8s-lab; ArgoCD picks them up.
  # Needs the HOME_K8S_LAB_TOKEN secret (fine-grained PAT, contents:write on
  # paguos/home-k8s-lab only).
  deploy-dev:
    name: deploy dev
    runs-on: ubuntu-latest
    needs: [publish]
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/bump-overlay.sh dev "${{ needs.publish.outputs.sha }}"
        env:
          GH_TOKEN: ${{ secrets.HOME_K8S_LAB_TOKEN }}

  deploy-prod:
    name: deploy prod
    runs-on: ubuntu-latest
    needs: [release, publish]
    if: needs.release.outputs.release_created == 'true'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/bump-overlay.sh prod "${{ needs.release.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.HOME_K8S_LAB_TOKEN }}
